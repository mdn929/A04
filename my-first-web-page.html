
<!DOCTYPE html>
<!-- Tells the browser that this document uses HTML5. -->

<html lang="en">
<!-- Starts the HTML document and tells the browser the page is written in English. -->

<head>
<!-- Starts the head section, which contains information about the webpage. -->

    <meta charset="UTF-8">
    <!-- Sets the character encoding to UTF-8 so letters and symbols display correctly. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the webpage adjust properly to different screen sizes and devices. -->

    <title>My First Web Page</title>
    <!-- Sets the title that appears in the browser tab. -->

</head>
<!-- Ends the head section. -->

<body>
<!-- Starts the body section where the visible webpage content is placed. -->

    <h1>My First Web Page</h1>
    <!-- Creates the main heading of the webpage. -->

    <p><strong>Username:</strong> mdn28</p>
    <!-- Creates a paragraph displaying the username. The strong element makes "Username:" bold. -->

    <p><strong>Course Name:</strong> Intro to Website Development</p>
    <!-- Creates a paragraph displaying the course name. -->

    <p><strong>Course Number:</strong> IS117</p>
    <!-- Creates a paragraph displaying the course number. -->

    <p><strong>Section:</strong> 001</p>
    <!-- Creates a paragraph displaying the course section. -->

    <footer>
    <!-- Starts the footer section at the bottom of the webpage. -->

        <p>&copy; 2026 Michelle Nacipucha | Due Date: 10/7/2026</p>
        <!-- Displays the copyright symbol, student's name, and assignment due date. -->

    </footer>
    <!-- Ends the footer section. -->

</body>
<!-- Ends the body section of the webpage. -->

</html>
<!-- Ends the HTML document. -->
